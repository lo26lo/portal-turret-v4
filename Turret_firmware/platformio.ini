; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;

[platformio]
default_envs = lolin_s3_mini

; Versions pinned on 25.09.2026 (lot 1): platform 7.1.3 = arduino-esp32 2.0.17
; (framework-arduinoespressif32 4.20017.260907). Git libraries are pinned to a commit.
; Transitive dependencies are listed explicitly so that they cannot drift.
[common]
platform = espressif32@7.1.3
lib_deps =
	https://github.com/adafruit/Adafruit_Sensor#0a9127a1e886ff1adb4c1b6f5958b24108d55aa6
	adafruit/Adafruit BusIO@1.17.4
	madhephaestus/ESP32Servo@1.2.1
	adafruit/Adafruit ADXL345@1.3.4
	fastled/FastLED@3.10.5
	bxparks/AceCommon@1.6.2
	bxparks/AceRoutine@1.5.1
	ESP32Async/AsyncTCP@3.5.0
	ESP32Async/ESPAsyncWebServer@3.12.1
	https://github.com/pschatzmann/arduino-libhelix#5c0a04302dbd661a56408eeb1756e01dd8d33ba1
	https://github.com/pschatzmann/arduino-audio-tools#4b6deecbe81a58b7a846e1cfd2d40a92befe35a6

[env:lolin_s3_mini]
platform = ${common.platform}
board = lolin_s3_mini
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
framework = arduino
build_flags =
  -Isrc
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DUSE_IDF_LOGGER
lib_deps =
	${common.lib_deps}

; Same build, but uploaded over WiFi to the turret's own access point.
; Connect to the "Portal Turret" network first, then: pio run -e lolin_s3_mini_ota -t upload
[env:lolin_s3_mini_ota]
extends = env:lolin_s3_mini
upload_protocol = custom
upload_command = curl --fail --max-time 120 -F "firmware=@$SOURCE" http://192.168.4.1/update