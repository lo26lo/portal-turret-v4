; PlatformIO Project Configuration File — Turret2 board only
;
; Board definition: boards/turret2.json (ESP32-S3-MINI-1-N8, 8 MB QIO flash, no PSRAM,
; partitions default_8MB.csv: 2 x 3.2 MB OTA apps, 1.5 MB LittleFS).
; Arduino variant:  variants/turret2/pins_arduino.h (SDA 35 / SCL 36, no RGB_BUILTIN).
; Never use the lolin_s3_mini board or memory_type opi: see docs/firmware-plan.md §2.1.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = turret2

; Versions pinned on 25.09.2026 (lot 1): platform 7.1.3 = arduino-esp32 2.0.17
; (framework-arduinoespressif32 4.20017.260907). Git libraries are pinned to a commit.
; Transitive dependencies are listed explicitly so that they cannot drift.
[common]
platform = espressif32@7.1.3
lib_deps =
	https://github.com/adafruit/Adafruit_Sensor#0a9127a1e886ff1adb4c1b6f5958b24108d55aa6
	adafruit/Adafruit BusIO@1.17.4
	madhephaestus/ESP32Servo@1.2.1
	adafruit/Adafruit LSM6DS@4.7.4
	fastled/FastLED@3.10.5
	bxparks/AceCommon@1.6.2
	bxparks/AceRoutine@1.5.1
	ESP32Async/AsyncTCP@3.5.0
	ESP32Async/ESPAsyncWebServer@3.12.1
	https://github.com/pschatzmann/arduino-libhelix#5c0a04302dbd661a56408eeb1756e01dd8d33ba1
	https://github.com/pschatzmann/arduino-audio-tools#4b6deecbe81a58b7a846e1cfd2d40a92befe35a6
; ARDUINO_USB_MODE=1 comes from the board definition.
build_flags =
	-Isrc
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DUSE_IDF_LOGGER

[env:turret2]
platform = ${common.platform}
board = turret2
board_build.variants_dir = variants
board_build.filesystem = littlefs
framework = arduino
; Web page (src/web/page/index.html) embedded in the firmware as gzip.
extra_scripts = pre:scripts/embed_page.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	${common.build_flags}
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	${common.lib_deps}

; Same build, uploaded over WiFi to the turret's own access point (WPA2).
; Connect to the "Portal Turret" network first, then: pio run -e turret2_ota -t upload
; Web user "turret", password = ApPassword: set the environment variable
; TURRET_PASSWORD first (factory value: stillalive), e.g. in PowerShell:
;   $env:TURRET_PASSWORD = "stillalive"
[env:turret2_ota]
extends = env:turret2
upload_protocol = custom
upload_command = curl --fail --max-time 180 -u turret:${sysenv.TURRET_PASSWORD} -F "firmware=@$SOURCE" http://192.168.4.1/update

; Same, from the home network once the turret has joined it (StaSsid), through
; its mDNS name. If the name does not resolve, use the IP shown on the web page:
;   curl -u turret:<password> -F "firmware=@.pio/build/turret2/firmware.bin" http://<ip>/update
[env:turret2_ota_home]
extends = env:turret2
upload_protocol = custom
upload_command = curl --fail --max-time 180 -u turret:${sysenv.TURRET_PASSWORD} -F "firmware=@$SOURCE" http://portal-turret.local/update

; Bring-up build for the first boards: verbose core logs, TURRET_BRINGUP defined
; (commissioning console, docs/firmware-plan.md §8).
[env:turret2_bringup]
extends = env:turret2
build_type = debug
build_flags =
	${common.build_flags}
	-DCORE_DEBUG_LEVEL=3
	-DTURRET_BRINGUP
